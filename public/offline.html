<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E0F14" />
    <title>Flow · Mất kết nối</title>
    <style>
      :root {
        --bg: #0e0f14;
        --surface: #14161d;
        --border: #262933;
        --text: #f4f4f6;
        --muted: #a3a7b7;
        --accent: #d4f04a;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: "Be Vietnam Pro", system-ui, sans-serif;
      }
      main {
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 28px;
        border-radius: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#D4F04A" />
        <polyline
          points="12,36 22,36 28,22 36,46 42,32 52,32"
          fill="none"
          stroke="#0E0F14"
          stroke-width="6.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <h1>Bạn đang offline</h1>
      <p>Flow cần mạng để đồng bộ số dư và giao dịch. Kết nối lại rồi thử lần nữa.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
